name: Release
on:
  pull_request:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make check-offline
  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/main
          out="$RUNNER_TEMP/fonia-release"
          bash release/prepare-assets.sh "$TAG" "$out"
          assets=()
          if [[ "$TAG" == *-* ]]; then
            assets=("$out"/*.zip "$out"/*.sha256)
            mode=--prerelease
          else
            mode=--draft
          fi
          gh release create "$TAG" "$mode" --verify-tag --title "Fonia $TAG" --notes-file "$out/notes.md" ${assets[@]+"${assets[@]}"}
