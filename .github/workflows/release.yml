name: Release
on:
  pull_request:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make check-offline
  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/main
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$ ]]
          version=$(python3 -c 'import plistlib; print(plistlib.load(open("Info.plist","rb"))["CFBundleShortVersionString"])')
          [[ "${TAG%%-*}" == "v$version" ]]
          grep -Fxq "## $TAG" CHANGELOG.md
          awk -v heading="## $TAG" '$0==heading {found=1;next} found&&/^## /{exit} found{print}' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [[ "$TAG" == *-* ]]; then
            printf '\nPré-release de código-fonte para compilação local (`make check`). Sem binário notarizado.\n' >> "$RUNNER_TEMP/notes.md"
            mode=--prerelease
          else
            mode=--draft
          fi
          gh release create "$TAG" "$mode" --verify-tag --title "Fonia $TAG" --notes-file "$RUNNER_TEMP/notes.md"
